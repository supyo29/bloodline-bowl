name: Football Intelligence Daily Refresh

# Refreshes upstream nflverse data, rebuilds a candidate Football Intelligence
# snapshot (honoring partial NFL weeks -- completed games count immediately,
# nothing is fabricated for games that haven't happened), validates it, and
# publishes it (commit to main) only if every gate passes and something
# materially changed. See docs/FOOTBALL_INTELLIGENCE_REFRESH.md for
# the full operational writeup of this pipeline.
#
# Schedule note (GitHub Actions cron is UTC and does NOT adjust for US DST):
#   "0 13 * * *"  = every day, 13:00 UTC
#     = 08:00 US Central during CDT (UTC-5, roughly mid-Mar to early-Nov)
#     = 07:00 US Central during CST (UTC-6, roughly early-Nov to mid-Mar)
#   A fixed UTC hour drifts by one Central clock-hour across the two DST
#   boundaries each year -- that is a property of UTC cron, not a bug here.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to build (blank = engine resolves automatically)"
        required: false
        type: string
      through_week:
        description: "Through-week to build (blank = engine resolves automatically)"
        required: false
        type: string
      force_refresh:
        description: "Force raw-source refresh even if a run just happened"
        required: false
        type: boolean
        default: true
      force_publish:
        description: "Allow publish even if season/week/completion would regress vs currently published (manual history rebuild only)"
        required: false
        type: boolean
        default: false

# Only one Football Intelligence refresh at a time, ever -- scheduled and
# manual runs share this group so they cannot race each other or the
# candidate/publish steps of a prior run.
concurrency:
  group: football-intel-daily-refresh
  cancel-in-progress: false

permissions:
  contents: write

env:
  CANDIDATE_ROOT: ${{ github.workspace }}/.fi-candidate
  SERVED_FILES: >-
    lib/football-intel/data/team_profile.csv
    lib/football-intel/data/player_usage_profile.csv
    lib/football-intel/data/unit_coverage_profile.csv
    lib/football-intel/data/contextual_matchup_feature.csv
    lib/football-intel/data/ftn_descriptive.csv
    lib/football-intel/data/football_intelligence_manifest.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: fi-r-pkgs-${{ runner.os }}-${{ hashFiles('.github/workflows/football-intel-daily-refresh.yml') }}
          restore-keys: |
            fi-r-pkgs-${{ runner.os }}-

      - name: Install R dependencies
        run: |
          Rscript -e '
            pkgs <- c("nflreadr", "dplyr", "tidyr", "jsonlite", "digest", "stringr", "yaml", "testthat", "tibble")
            missing <- setdiff(pkgs, rownames(installed.packages()))
            if (length(missing)) install.packages(missing, Ncpus = parallel::detectCores())
            invisible(lapply(pkgs, function(p) library(p, character.only = TRUE)))
          '

      - name: Cache nflverse raw fetch
        uses: actions/cache@v4
        with:
          path: analysis/football_intel/cache
          # Season-scoped key: within a day's runs, reuse untouched historical
          # seasons' fetches; --refresh below still forces every source to
          # re-check for new rows regardless of cache hit.
          key: fi-raw-cache-${{ github.run_id }}
          restore-keys: |
            fi-raw-cache-

      - name: Record currently-published manifest (last known good)
        id: published
        run: |
          if [ -f lib/football-intel/data/football_intelligence_manifest.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            V=$(jq -r .football_intelligence_version lib/football-intel/data/football_intelligence_manifest.json)
            S=$(jq -r .season lib/football-intel/data/football_intelligence_manifest.json)
            W=$(jq -r .through_week lib/football-intel/data/football_intelligence_manifest.json)
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "season=$S" >> "$GITHUB_OUTPUT"
            echo "through_week=$W" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          # last-known-good fingerprint of the COMMITTED state at HEAD (not
          # the working-tree disk, which the stage step is about to
          # overwrite locally) -- re-checked against origin at the very end
          # against the actual remote ref, so a failed Node test or any
          # other post-staging failure is judged against what's really
          # published, not against this job's already-mutated checkout.
          HASH=$( { for f in $SERVED_FILES; do git show "HEAD:$f" 2>/dev/null; done; } | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      # --- refresh -----------------------------------------------------
      - name: Refresh raw sources
        id: fetch
        run: |
          set -o pipefail
          REFRESH_FLAG="--refresh"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_refresh }}" = "false" ]; then
            REFRESH_FLAG=""
          fi
          Rscript analysis/football_intel/fetch_raw.R $REFRESH_FLAG 2>&1 | tee /tmp/fetch.log
          if grep -qi "error" /tmp/fetch.log; then
            echo "result=FAILED_FETCH" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "result=OK" >> "$GITHUB_OUTPUT"

      # --- build candidate (outside the served directory); through_week
      # naturally lands on a partial current week the moment any of its
      # games have pbp data -- see build_snapshot.R's target resolution and
      # FI$compute_week_completion in config.R for the honesty guarantee.
      - name: Build candidate snapshot
        id: build
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "${{ inputs.season }}" ]; then ARGS="${{ inputs.season }}"; fi
          if [ -n "${{ inputs.through_week }}" ]; then ARGS="$ARGS ${{ inputs.through_week }}"; fi
          bash analysis/football_intel/build_candidate.sh "$CANDIDATE_ROOT" $ARGS 2>&1 | tee /tmp/build.log
          if [ ! -f "$CANDIDATE_ROOT/lib/football-intel/data/football_intelligence_manifest.json" ]; then
            echo "result=FAILED_BUILD" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "result=OK" >> "$GITHUB_OUTPUT"

      # --- validate + compare (candidate vs currently published) --------
      - name: Validate candidate
        id: validate
        run: |
          set -o pipefail
          PUB_DIR="NONE"
          if [ "${{ steps.published.outputs.exists }}" = "true" ]; then
            PUB_DIR="${{ github.workspace }}/lib/football-intel/data"
          fi
          FORCE_FLAG=""
          if [ "${{ inputs.force_publish }}" = "true" ]; then FORCE_FLAG="--force"; fi
          if Rscript analysis/football_intel/validate_snapshot.R "$CANDIDATE_ROOT/lib/football-intel/data" "$PUB_DIR" $FORCE_FLAG 2>&1 | tee /tmp/validate.log; then
            echo "result=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAILED_VALIDATION" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # --- required daily gates: fast, deterministic, cache-only ---------
      - name: Football Intelligence invariant tests (REQUIRED)
        run: Rscript analysis/football_intel/tests/run.R

      - name: Football Intelligence adversarial audit (REQUIRED)
        run: Rscript analysis/football_intel/adversarial_audit.R

      # --- decide UPDATED vs NO_CHANGE -----------------------------------
      # Version is a content hash that explicitly includes
      # games_completed_in_latest_week (see FI$compute_version in config.R),
      # so a week that goes from N to N+1 completed games gets a new version
      # even when season/through_week are unchanged -- season+week equality
      # is never used as a NO_CHANGE proxy.
      - name: Compare candidate vs published version
        id: compare
        run: |
          CAND_VERSION=$(jq -r .football_intelligence_version "$CANDIDATE_ROOT/lib/football-intel/data/football_intelligence_manifest.json")
          echo "candidate_version=$CAND_VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.published.outputs.exists }}" = "true" ] && [ "$CAND_VERSION" = "${{ steps.published.outputs.version }}" ]; then
            echo "outcome=NO_CHANGE" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=UPDATED" >> "$GITHUB_OUTPUT"
          fi

      # --- concurrency check happens BEFORE we touch any local served file,
      # so a stale base aborts without ever mutating the checkout. ---------
      - name: Check origin/main has not moved
        id: concurrency
        if: steps.compare.outputs.outcome == 'UPDATED'
        run: |
          git fetch origin main
          BASE_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(git rev-parse origin/main)
          if [ "$BASE_SHA" != "$REMOTE_SHA" ] && [ "${{ github.ref_name }}" = "main" ]; then
            echo "origin/main moved during this run ($BASE_SHA -> $REMOTE_SHA); aborting publish rather than overwriting concurrent work." >&2
            echo "result=CONCURRENCY_ABORT" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # no output on success -- see the Node-test step for why.

      # --- stage the candidate locally (copy only -- no commit/push yet) -
      - name: Stage candidate into served directory
        id: stage
        if: steps.compare.outputs.outcome == 'UPDATED'
        run: |
          set -euo pipefail
          for f in $SERVED_FILES; do
            name=$(basename "$f")
            cp "$CANDIDATE_ROOT/lib/football-intel/data/$name" "$f"
          done

      # --- the Node read-contract test runs against the staged files BEFORE
      # any commit or push -- a failure here leaves the git repository (the
      # only thing anyone else ever sees) completely untouched, satisfying
      # "last known good remains available if a refresh fails" even though
      # the local checkout has already been overwritten in this job's
      # ephemeral, never-pushed working tree. -----------------------------
      - name: Node football-intel read-contract test (REQUIRED before publish)
        id: node_test
        if: steps.compare.outputs.outcome == 'UPDATED'
        run: |
          npm ci
          if ! node --import tsx --test test/football-intel-read.test.ts; then
            echo "result=FAILED_NODE_CONTRACT" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # no output on success: the job-summary priority chain treats an
          # empty output as "keep looking," so only failure codes are ever
          # written here -- a later step's real outcome (PUBLISHED/NO_CHANGE)
          # must not be shadowed by an earlier step's mere "it passed."

      # --- second, authoritative drift check: origin/main (or whatever ref
      # triggered this run) can move at any point during npm ci / the Node
      # test, which takes real wall-clock time. The early check only proves
      # main hadn't moved yet when we started staging; this one is the one
      # that actually gates the push. -------------------------------------
      - name: Check origin/main has not moved (final, immediately pre-publish)
        id: concurrency_final
        if: steps.compare.outputs.outcome == 'UPDATED'
        run: |
          git fetch origin main
          BASE_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(git rev-parse origin/main)
          if [ "$BASE_SHA" != "$REMOTE_SHA" ] && [ "${{ github.ref_name }}" = "main" ]; then
            echo "origin/main moved during staging/npm-ci/Node-test ($BASE_SHA -> $REMOTE_SHA); aborting publish rather than overwriting concurrent work. No rebase, no force push, no automatic conflict repair." >&2
            echo "result=CONCURRENCY_ABORT" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # no output on success -- see the Node-test step for why.

      # --- publish: only after both concurrency checks + staging + the
      # Node read-contract test have all passed ---------------------------
      - name: Commit and push
        id: publish
        if: steps.compare.outputs.outcome == 'UPDATED'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add $SERVED_FILES

          if git diff --cached --quiet; then
            echo "candidate version differs but served files are byte-identical; nothing to commit"
            echo "result=NO_CHANGE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SEASON=$(jq -r .season lib/football-intel/data/football_intelligence_manifest.json)
          WEEK=$(jq -r .through_week lib/football-intel/data/football_intelligence_manifest.json)
          WEEK_STATE=$(jq -r .week_completion.week_state lib/football-intel/data/football_intelligence_manifest.json)
          GC=$(jq -r .week_completion.games_completed_in_latest_week lib/football-intel/data/football_intelligence_manifest.json)
          GS=$(jq -r .week_completion.games_scheduled_in_latest_week lib/football-intel/data/football_intelligence_manifest.json)
          MSG="football-intel: refresh ${SEASON} week ${WEEK} (${WEEK_STATE}, ${GC}/${GS} games)"$'\n\n'"Automated daily Football Intelligence refresh."$'\n'"version: ${{ steps.compare.outputs.candidate_version }}"$'\n'"previous: ${{ steps.published.outputs.version }}"$'\n\n'"Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>"
          git commit -m "$MSG"

          git push origin HEAD:${{ github.ref_name }}
          echo "result=PUBLISHED" >> "$GITHUB_OUTPUT"

      # --- proof that a failed/partial run never mutates the real,
      # REMOTE last-known-good snapshot. This checks origin/${ref}'s actual
      # committed content (via `git show`), not this job's local disk --
      # the local checkout is expected to already differ after staging (or
      # to be left in a half-updated state if the Node test failed), and
      # that is irrelevant: the runner is thrown away either way. Only a
      # change to what origin/${ref} actually serves would matter, and that
      # can only happen through the publish step above. -------------------
      - name: Verify remote last-known-good untouched unless published
        if: always()
        run: |
          OUTCOME="${{ steps.publish.outputs.result || steps.concurrency_final.outputs.result || steps.node_test.outputs.result || steps.concurrency.outputs.result || 'NONE' }}"
          git fetch origin ${{ github.ref_name }} || true
          REMOTE_HASH=$( { for f in $SERVED_FILES; do git show "origin/${{ github.ref_name }}:$f" 2>/dev/null; done; } | sha256sum | cut -d' ' -f1)
          if [ "$OUTCOME" != "PUBLISHED" ] && [ "$REMOTE_HASH" != "${{ steps.published.outputs.hash }}" ]; then
            echo "::error::remote last-known-good changed without a successful publish from this run (outcome=$OUTCOME) -- last-known-good guarantee violated"
            exit 1
          fi
          echo "last-known-good integrity verified (outcome=$OUTCOME)"

      - name: Job summary
        if: always()
        run: |
          {
            echo "# Football Intelligence Daily Refresh"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| result | ${{ steps.publish.outputs.result || steps.concurrency_final.outputs.result || steps.node_test.outputs.result || steps.compare.outputs.outcome || steps.concurrency.outputs.result || steps.validate.outputs.result || steps.build.outputs.result || steps.fetch.outputs.result || 'UNKNOWN' }} |"
            if [ -f "$CANDIDATE_ROOT/lib/football-intel/data/football_intelligence_manifest.json" ]; then
              M="$CANDIDATE_ROOT/lib/football-intel/data/football_intelligence_manifest.json"
              echo "| season | $(jq -r .season "$M") |"
              echo "| through_week | $(jq -r .through_week "$M") |"
              echo "| week_state | $(jq -r .week_completion.week_state "$M") |"
              echo "| games_completed_in_latest_week | $(jq -r .week_completion.games_completed_in_latest_week "$M") |"
              echo "| games_scheduled_in_latest_week | $(jq -r .week_completion.games_scheduled_in_latest_week "$M") |"
              echo "| latest_completed_game_date | $(jq -r .week_completion.latest_completed_game_date "$M") |"
              echo "| previous_version | ${{ steps.published.outputs.version || 'none' }} |"
              echo "| new_version | $(jq -r .football_intelligence_version "$M") |"
              echo "| generated_at | $(jq -r .generated_at "$M") |"
              echo
              echo "## source cutoffs"
              echo '```json'
              jq -r .data_cutoff "$M"
              echo '```'
            fi
            echo
            echo "## validation gates"
            if [ -f "$CANDIDATE_ROOT/lib/football-intel/data/validation_result.json" ]; then
              R="$CANDIDATE_ROOT/lib/football-intel/data/validation_result.json"
              echo '```json'
              jq -r '.gates[] | "[\(.status)] \(.name)  \(.detail)"' "$R"
              echo '```'
              echo
              echo "## source classification"
              echo '```json'
              jq -r .source_classification "$R"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
