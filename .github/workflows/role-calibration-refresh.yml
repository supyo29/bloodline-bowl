name: Role Calibration Inputs Refresh

# Keeps the Projection-Calibration Phase-2 role inputs current so the Vercel cron (/api/cron/role-calibration) can
#   (1) freeze PRE-GAME role forecasts for the coming week and (2) join actual role to the Phase-1 calibration ledger after games finalize.
# Rebuilds the canonical Role Intelligence substrate from the refreshed nflverse raw cache, then exports ONLY lib/role-calibration/data/**.
# It deliberately does NOT commit lib/player-role-intelligence/data (the served Role artifact is a separate product). Data-only commits do not
# match the push paths below, so there is no refresh loop.
on:
  schedule:
    - cron: "30 13 * * *"   # after the Football Intelligence refresh (0 13 * * *); UTC, DST drift as documented in football-intel-daily-refresh.yml
  push:
    branches: [main]
    paths:
      - "analysis/role_calibration/**"
      - ".github/workflows/role-calibration-refresh.yml"
  workflow_dispatch:
    inputs:
      target_weeks:
        description: "Comma list of target weeks (blank = current NFL week and the next)"
        required: false
        type: string

concurrency:
  group: role-calibration-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: role-r-pkgs-${{ runner.os }}-${{ hashFiles('.github/workflows/role-calibration-refresh.yml') }}
          restore-keys: |
            role-r-pkgs-${{ runner.os }}-
            fi-r-pkgs-${{ runner.os }}-
      - name: Install R dependencies
        run: |
          Rscript -e '
            pkgs <- c("nflreadr", "dplyr", "tidyr", "jsonlite", "digest", "stringr", "yaml", "tibble", "purrr")
            missing <- setdiff(pkgs, rownames(installed.packages()))
            if (length(missing)) install.packages(missing, Ncpus = parallel::detectCores())
            invisible(lapply(pkgs, function(p) library(p, character.only = TRUE)))
          '
      - name: Cache nflverse raw fetch
        uses: actions/cache@v4
        with:
          path: analysis/football_intel/cache
          key: role-raw-cache-${{ github.run_id }}
          restore-keys: |
            role-raw-cache-
            fi-raw-cache-
      - name: Refresh raw nflverse sources
        run: Rscript analysis/football_intel/fetch_raw.R --refresh
      - name: Rebuild canonical role substrate (internal cache only)
        run: |
          Rscript analysis/player_role/run_build.R 2026
          # run_build.R also rewrites the served Role Intelligence artifact; that product is out of scope here — restore it
          git checkout -- lib/player-role-intelligence/data
      - name: Resolve target weeks
        id: weeks
        run: |
          if [ -n "${{ github.event.inputs.target_weeks }}" ]; then W="${{ github.event.inputs.target_weeks }}"; else
            W=$(Rscript -e 'suppressMessages(library(nflreadr)); w <- as.integer(get_current_week()); cat(paste(c(w, w + 1L), collapse=","))')
          fi
          echo "weeks=$W" >> "$GITHUB_OUTPUT"
      - name: Export role calibration inputs
        run: |
          Rscript analysis/role_calibration/export_role_inputs.R 2026 "${{ steps.weeks.outputs.weeks }}"
          Rscript analysis/role_calibration/export_position_yields.R 2025
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/role-calibration/data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "role-calibration: refresh inputs (target weeks ${{ steps.weeks.outputs.weeks }})"
          git pull --rebase origin main
          git push origin HEAD:main
