name: W2.R1 Weekly Pregame Capture

# Freezes the PREGAME W2.R1 component belief for the next NFL week (D/ST + K components from the frozen S4 models, upside rows from the frozen S6 models, qualification snapshot)
# BEFORE the first kickoff and registers it in the bundled loader index, so the main weekly context can apply the QUALIFIED D/ST component values for that week.
# Never refits on Weeks 1-5 (the final set is spent); never rewrites a frozen week (the freezer refuses if a manifest exists or if now >= first kickoff).
# Schedule + manual dispatch only. Idempotent: if the week is already frozen (or already kicked off) the job exits without change.
on:
  schedule:
    - cron: "0 17 * * 3"   # Wednesday 17:00 UTC (injury designations still partial: unknown is treated as NONE and flagged)
    - cron: "0 15 * * 4"   # Thursday 15:00 UTC (~9 h before the Thursday-night kickoff)
  workflow_dispatch:
    inputs:
      week:
        description: "Target NFL week (blank = next week with an unplayed first kickoff)"
        required: false
        type: string

concurrency:
  group: w2r1-weekly-capture
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true
      - name: Install R dependencies
        run: |
          Rscript -e '
            pkgs <- c("nflreadr", "data.table", "jsonlite", "digest")
            missing <- setdiff(pkgs, rownames(installed.packages()))
            if (length(missing)) install.packages(missing, Ncpus = parallel::detectCores())
            invisible(lapply(pkgs, function(p) library(p, character.only = TRUE)))
          '
      - name: Verify the S7 freeze is intact
        run: npx tsx scripts/w2r1/s7_verify_frozen.ts
      - name: Resolve week and first kickoff
        id: wk
        run: |
          Rscript -e '
            suppressMessages(library(nflreadr)); a <- commandArgs(TRUE); s <- load_schedules(2026); s <- s[s$game_type == "REG", ]
            s$ko <- as.POSIXct(paste(s$gameday, s$gametime), tz = "America/New_York")
            wk <- if (nzchar(a[1])) as.integer(a[1]) else min(s$week[is.na(s$result) & s$ko > Sys.time()])
            ko <- min(s$ko[s$week == wk]); cat(sprintf("week=%d\nkickoff=%s\n", wk, format(ko, tz = "UTC", usetz = FALSE, format = "%Y-%m-%dT%H:%M:%SZ")))
          ' "${{ github.event.inputs.week }}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Freeze the pregame belief
        run: |
          W="${{ steps.wk.outputs.week }}"; WK2=$(printf '%02d' "$W")
          if [ -f "lib/w2r1/data/prospective/wk$WK2/manifest.json" ]; then echo "week $W already frozen"; exit 0; fi
          Rscript scripts/w2r1/prospective/s8_pregame_kdst.R "$W"
          Rscript scripts/w2r1/prospective/s8_pregame_upside.R "$W"
          npx tsx scripts/w2r1/prospective/s8_freeze_week.ts "$W" "${{ steps.wk.outputs.kickoff }}"
      - name: Test the frozen capture
        run: npx tsx --test test/w2r1-s8.test.ts test/w2r1-integration.test.ts
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/w2r1/data/prospective
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "w2r1: freeze pregame capture (week ${{ steps.wk.outputs.week }})"
          git pull --rebase origin main
          git push origin HEAD:main
